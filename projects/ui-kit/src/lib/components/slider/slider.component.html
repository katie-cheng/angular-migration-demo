<div class="bk-slider">
  <span class="bk-slider__label">{{ label }}</span>
  <mat-slider [min]="min" [max]="max" #ngSlider><input matSliderThumb [value]="value" (change)="valueChanged.emit({source: ngSliderThumb, parent: ngSlider, value: ngSliderThumb.value}.value ?? 0)" #ngSliderThumb="matSliderThumb" /></mat-slider>
</div>
