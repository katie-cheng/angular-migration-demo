<mat-card class="sbp-approvals bk-col bk-gap-12px">
  <h2>Awaiting approval</h2>
  <mat-divider></mat-divider>

  <table mat-table [dataSource]="(accounts$ | async) || []" class="sbp-approvals__table">
    <ng-container matColumnDef="nickname">
      <th mat-header-cell *matHeaderCellDef>Account</th>
      <td mat-cell *matCellDef="let row">{{ row.nickname }}</td>
    </ng-container>

    <ng-container matColumnDef="maskedNumber">
      <th mat-header-cell *matHeaderCellDef>Number</th>
      <td mat-cell *matCellDef="let row">{{ row.maskedNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="availableBalance">
      <th mat-header-cell *matHeaderCellDef>Available</th>
      <td mat-cell *matCellDef="let row">{{ row.availableBalance | currency:row.currency }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
