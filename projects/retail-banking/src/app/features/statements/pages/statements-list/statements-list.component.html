<section class="statements-list" fxLayout="column" fxLayoutGap="16px">
  <header class="statements-list__header"
          fxLayout="row"
          fxLayout.lt-md="column"
          fxLayoutAlign="space-between center"
          fxLayoutAlign.lt-md="start stretch"
          fxLayoutGap="12px">
    <div fxLayout="column" fxLayoutGap="4px">
      <h1 class="statements-list__title">Statements</h1>
      <p class="statements-list__subtitle" fxHide.lt-sm>Downloadable statements and tax documents.</p>
    </div>

    <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="8px" fxFlex.lt-md="100">
      <mat-form-field appearance="legacy" class="statements-list__search" fxFlex="240px" fxFlex.lt-md="auto">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="search" autocomplete="off" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-stroked-button (click)="reload()">
        <mat-icon>refresh</mat-icon>
        Refresh
      </button>
    </div>
  </header>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

  <div class="statements-list__body" fxLayout="row" fxLayout.lt-lg="column" fxLayoutGap="16px">
    <mat-card class="statements-list__table-card" fxFlex="grow">
      <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

      <table mat-table [dataSource]="rows" matSort class="statements-list__table">
    <ng-container matColumnDef="period">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Period</th>
      <td mat-cell *matCellDef="let statement">{{ statement.period }}</td>
    </ng-container>

    <ng-container matColumnDef="issuedOn">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Issued</th>
      <td mat-cell *matCellDef="let statement">{{ statement.issuedOn | date:'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="format">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Format</th>
      <td mat-cell *matCellDef="let statement">{{ statement.format }}</td>
    </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row
            *matRowDef="let row; columns: displayedColumns"
            (click)="open(row)"
            class="statements-list__row"></tr>
      </table>

      <bk-empty-state *ngIf="!loading && !rows.length"
                      heading="Nothing here yet"
                      message="Downloadable statements and tax documents."></bk-empty-state>

      <mat-paginator [length]="total"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="[10, 25, 50]"
                     (page)="onPage($event)"></mat-paginator>
    </mat-card>

    <aside class="statements-list__aside" fxFlex="300px" fxFlex.lt-lg="100" fxHide.lt-md>
      <bk-statements-summary [count]="total" [loading]="loading"></bk-statements-summary>
    </aside>
  </div>
</section>
