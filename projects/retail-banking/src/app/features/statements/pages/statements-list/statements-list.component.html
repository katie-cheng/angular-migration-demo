<section class="statements-list bk-col bk-gap-16px">
  <header class="statements-list__header bk-row bk-col-lt-md bk-justify-space-between bk-items-center bk-justify-start-lt-md bk-items-stretch-lt-md bk-gap-12px">
    <div class="bk-col bk-gap-4px">
      <h1 class="statements-list__title">Statements</h1>
      <p class="statements-list__subtitle bk-hide-lt-sm">Downloadable statements and tax documents.</p>
    </div>

    <div class="bk-row bk-justify-end bk-items-center bk-gap-8px bk-flex-100-lt-md">
      <mat-form-field appearance="legacy" class="statements-list__search bk-flex-240px bk-flex-auto-lt-md">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="search" autocomplete="off" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-stroked-button (click)="reload()">
        <mat-icon>refresh</mat-icon>
        Refresh
      </button>
    </div>
  </header>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

  <div class="statements-list__body bk-row bk-col-lt-lg bk-gap-16px">
    <mat-card class="statements-list__table-card bk-flex-grow">
      <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

      <table mat-table [dataSource]="rows" matSort class="statements-list__table">
    <ng-container matColumnDef="period">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Period</th>
      <td mat-cell *matCellDef="let statement">{{ statement.period }}</td>
    </ng-container>

    <ng-container matColumnDef="issuedOn">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Issued</th>
      <td mat-cell *matCellDef="let statement">{{ statement.issuedOn | date:'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="format">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Format</th>
      <td mat-cell *matCellDef="let statement">{{ statement.format }}</td>
    </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row
            *matRowDef="let row; columns: displayedColumns"
            (click)="open(row)"
            class="statements-list__row"></tr>
      </table>

      <bk-empty-state *ngIf="!loading && !rows.length"
                      heading="Nothing here yet"
                      message="Downloadable statements and tax documents."></bk-empty-state>

      <mat-paginator [length]="total"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="[10, 25, 50]"
                     (page)="onPage($event)"></mat-paginator>
    </mat-card>

    <aside class="statements-list__aside bk-flex-300px bk-flex-100-lt-lg bk-hide-lt-md">
      <bk-statements-summary [count]="total" [loading]="loading"></bk-statements-summary>
    </aside>
  </div>
</section>
