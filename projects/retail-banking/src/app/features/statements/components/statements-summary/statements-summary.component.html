<mat-card class="statements-summary bk-col bk-gap-8px">
  <div class="bk-row bk-justify-start bk-items-center bk-gap-8px">
    <mat-icon class="statements-summary__icon">description</mat-icon>
    <h3 class="statements-summary__title bk-flex">Statements</h3>
  </div>

  <mat-divider></mat-divider>

  <div class="bk-row bk-justify-space-between bk-items-baseline">
    <span class="statements-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="statements-summary__blurb bk-hide-lt-md">Downloadable statements and tax documents.</p>
</mat-card>
