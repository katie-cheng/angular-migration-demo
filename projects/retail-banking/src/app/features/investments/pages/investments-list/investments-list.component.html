<section class="investments-list bk-col bk-gap-16px">
  <header class="investments-list__header bk-row bk-col-lt-md bk-justify-space-between bk-items-center bk-justify-start-lt-md bk-items-stretch-lt-md bk-gap-12px">
    <div class="bk-col bk-gap-4px">
      <h1 class="investments-list__title">Investments</h1>
      <p class="investments-list__subtitle bk-hide-lt-sm">Brokerage holdings, performance and dividend history.</p>
    </div>

    <div class="bk-row bk-justify-end bk-items-center bk-gap-8px bk-flex-100-lt-md">
      <mat-form-field appearance="legacy" class="investments-list__search bk-flex-240px bk-flex-auto-lt-md">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="search" autocomplete="off" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-stroked-button (click)="reload()">
        <mat-icon>refresh</mat-icon>
        Refresh
      </button>
    </div>
  </header>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

  <div class="investments-list__body bk-row bk-col-lt-lg bk-gap-16px">
    <mat-card class="investments-list__table-card bk-flex-grow">
      <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

      <table mat-table [dataSource]="rows" matSort class="investments-list__table">
    <ng-container matColumnDef="symbol">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Symbol</th>
      <td mat-cell *matCellDef="let holding">{{ holding.symbol }}</td>
    </ng-container>

    <ng-container matColumnDef="units">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Units</th>
      <td mat-cell *matCellDef="let holding">{{ holding.units }}</td>
    </ng-container>

    <ng-container matColumnDef="marketValue">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Market value</th>
      <td mat-cell *matCellDef="let holding">{{ holding.marketValue | currency:'GBP' }}</td>
    </ng-container>

    <ng-container matColumnDef="gainLoss">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Gain / loss</th>
      <td mat-cell *matCellDef="let holding">{{ holding.gainLoss | currency:'GBP' }}</td>
    </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row
            *matRowDef="let row; columns: displayedColumns"
            (click)="open(row)"
            class="investments-list__row"></tr>
      </table>

      <bk-empty-state *ngIf="!loading && !rows.length"
                      heading="Nothing here yet"
                      message="Brokerage holdings, performance and dividend history."></bk-empty-state>

      <mat-paginator [length]="total"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="[10, 25, 50]"
                     (page)="onPage($event)"></mat-paginator>
    </mat-card>

    <aside class="investments-list__aside bk-flex-300px bk-flex-100-lt-lg bk-hide-lt-md">
      <bk-investments-summary [count]="total" [loading]="loading"></bk-investments-summary>
    </aside>
  </div>
</section>
