<section class="investments-detail" fxLayout="column" fxLayoutGap="16px">
  <bk-breadcrumbs [crumbs]="crumbs"></bk-breadcrumbs>

  <div *ngIf="loading" fxLayout="row" fxLayoutAlign="center center" class="investments-detail__loading">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <ng-container *ngIf="holding as holding">
    <mat-card class="investments-detail__card" fxLayout="column" fxLayoutGap="12px">
      <div fxLayout="row" fxLayout.lt-md="column" fxLayoutAlign="space-between start" fxLayoutGap="12px">
        <h2 class="investments-detail__title" fxFlex>Holding detail</h2>
        <div fxLayout="row" fxLayoutGap="8px" fxLayoutAlign="end center">
          <button mat-stroked-button (click)="back()">Back</button>
        </div>
      </div>

      <mat-divider></mat-divider>

      <div class="investments-detail__rows" fxLayout="column" fxLayoutGap="8px">
      <div class="detail-row" fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="8px">
        <span class="detail-row__label" fxFlex="180px" fxFlex.lt-sm="auto">Symbol</span>
        <span class="detail-row__value" fxFlex>{{ holding.symbol }}</span>
      </div>
      <div class="detail-row" fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="8px">
        <span class="detail-row__label" fxFlex="180px" fxFlex.lt-sm="auto">Units</span>
        <span class="detail-row__value" fxFlex>{{ holding.units }}</span>
      </div>
      <div class="detail-row" fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="8px">
        <span class="detail-row__label" fxFlex="180px" fxFlex.lt-sm="auto">Market value</span>
        <span class="detail-row__value" fxFlex>{{ holding.marketValue | currency:'GBP' }}</span>
      </div>
      <div class="detail-row" fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="8px">
        <span class="detail-row__label" fxFlex="180px" fxFlex.lt-sm="auto">Gain / loss</span>
        <span class="detail-row__value" fxFlex>{{ holding.gainLoss | currency:'GBP' }}</span>
      </div>
      </div>
    </mat-card>
  </ng-container>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>
</section>
