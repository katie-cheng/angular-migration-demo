<section class="loans-list bk-col bk-gap-16px">
  <header class="loans-list__header bk-row bk-col-lt-md bk-justify-space-between bk-items-center bk-justify-start-lt-md bk-items-stretch-lt-md bk-gap-12px">
    <div class="bk-col bk-gap-4px">
      <h1 class="loans-list__title">Loans</h1>
      <p class="loans-list__subtitle bk-hide-lt-sm">Personal loan balances, schedules and overpayment quotes.</p>
    </div>

    <div class="bk-row bk-justify-end bk-items-center bk-gap-8px bk-flex-100-lt-md">
      <mat-form-field appearance="legacy" class="loans-list__search bk-flex-240px bk-flex-auto-lt-md">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="search" autocomplete="off" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-stroked-button (click)="reload()">
        <mat-icon>refresh</mat-icon>
        Refresh
      </button>
    </div>
  </header>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

  <div class="loans-list__body bk-row bk-col-lt-lg bk-gap-16px">
    <mat-card class="loans-list__table-card bk-flex-grow">
      <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

      <table mat-table [dataSource]="rows" matSort class="loans-list__table">
    <ng-container matColumnDef="product">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Product</th>
      <td mat-cell *matCellDef="let loan">{{ loan.product }}</td>
    </ng-container>

    <ng-container matColumnDef="outstanding">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Outstanding</th>
      <td mat-cell *matCellDef="let loan">{{ loan.outstanding | currency:'GBP' }}</td>
    </ng-container>

    <ng-container matColumnDef="rate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Rate</th>
      <td mat-cell *matCellDef="let loan">{{ loan.rate }}</td>
    </ng-container>

    <ng-container matColumnDef="nextPaymentOn">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Next payment</th>
      <td mat-cell *matCellDef="let loan">{{ loan.nextPaymentOn | date:'mediumDate' }}</td>
    </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row
            *matRowDef="let row; columns: displayedColumns"
            (click)="open(row)"
            class="loans-list__row"></tr>
      </table>

      <bk-empty-state *ngIf="!loading && !rows.length"
                      heading="Nothing here yet"
                      message="Personal loan balances, schedules and overpayment quotes."></bk-empty-state>

      <mat-paginator [length]="total"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="[10, 25, 50]"
                     (page)="onPage($event)"></mat-paginator>
    </mat-card>

    <aside class="loans-list__aside bk-flex-300px bk-flex-100-lt-lg bk-hide-lt-md">
      <bk-loans-summary [count]="total" [loading]="loading"></bk-loans-summary>
    </aside>
  </div>
</section>
