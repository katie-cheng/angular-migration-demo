<section class="loans-detail bk-col bk-gap-16px">
  <bk-breadcrumbs [crumbs]="crumbs"></bk-breadcrumbs>

  <div *ngIf="loading" class="loans-detail__loading bk-row bk-justify-center bk-items-center">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <ng-container *ngIf="loan as loan">
    <mat-card class="loans-detail__card bk-col bk-gap-12px">
      <div class="bk-row bk-col-lt-md bk-justify-space-between bk-items-start bk-gap-12px">
        <h2 class="loans-detail__title bk-flex">Loan detail</h2>
        <div class="bk-row bk-gap-8px bk-justify-end bk-items-center">
          <button mat-stroked-button (click)="back()">Back</button>
        </div>
      </div>

      <mat-divider></mat-divider>

      <div class="loans-detail__rows bk-col bk-gap-8px">
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Product</span>
        <span class="detail-row__value bk-flex">{{ loan.product }}</span>
      </div>
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Outstanding</span>
        <span class="detail-row__value bk-flex">{{ loan.outstanding | currency:'GBP' }}</span>
      </div>
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Rate</span>
        <span class="detail-row__value bk-flex">{{ loan.rate }}</span>
      </div>
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Next payment</span>
        <span class="detail-row__value bk-flex">{{ loan.nextPaymentOn | date:'mediumDate' }}</span>
      </div>
      </div>
    </mat-card>
  </ng-container>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>
</section>
