<mat-card class="loans-summary bk-col bk-gap-8px">
  <div class="bk-row bk-justify-start bk-items-center bk-gap-8px">
    <mat-icon class="loans-summary__icon">request_quote</mat-icon>
    <h3 class="loans-summary__title bk-flex">Loans</h3>
  </div>

  <mat-divider></mat-divider>

  <div class="bk-row bk-justify-space-between bk-items-baseline">
    <span class="loans-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="loans-summary__blurb bk-hide-lt-md">Personal loan balances, schedules and overpayment quotes.</p>
</mat-card>
