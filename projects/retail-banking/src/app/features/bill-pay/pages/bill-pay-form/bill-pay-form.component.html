<section class="bill-pay-form bk-col bk-gap-16px">
  <h1 class="bill-pay-form__title">{{ editing ? 'Edit' : 'New' }} bill</h1>

  <mat-card>
    <form class="bk-col bk-gap-12px" [formGroup]="form" (ngSubmit)="submit()">
      <div class="bk-row bk-wrap bk-gap-16px bk-col-lt-md">
      <mat-form-field class="bk-flex-50 bk-flex-100-lt-md" appearance="fill">
        <mat-label>Biller</mat-label>
        <input matInput formControlName="biller" />
        <mat-error *ngIf="form.controls['biller'].hasError('required')">Biller is required</mat-error>
      </mat-form-field>

      <mat-form-field class="bk-flex-50 bk-flex-100-lt-md" appearance="fill">
        <mat-label>Reference</mat-label>
        <input matInput formControlName="accountRef" />
        <mat-error *ngIf="form.controls['accountRef'].hasError('required')">Reference is required</mat-error>
      </mat-form-field>

      <mat-form-field class="bk-flex-50 bk-flex-100-lt-md" appearance="fill">
        <mat-label>Amount</mat-label>
        <input matInput type="number" formControlName="amount" />
        <span matPrefix *ngIf="true">&pound;&nbsp;</span>
      </mat-form-field>

      <mat-form-field class="bk-flex-50 bk-flex-100-lt-md" appearance="fill">
        <mat-label>Due</mat-label>
        <input matInput [matDatepicker]="dueOnPicker" formControlName="dueOn" />
        <mat-datepicker-toggle matSuffix [for]="dueOnPicker"></mat-datepicker-toggle>
        <mat-datepicker #dueOnPicker></mat-datepicker>
      </mat-form-field>
      </div>

      <mat-divider></mat-divider>

      <div class="bk-row bk-justify-end bk-items-center bk-gap-8px bk-justify-start-lt-sm bk-items-stretch-lt-sm">
        <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || saving">
          {{ saving ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </mat-card>
</section>
