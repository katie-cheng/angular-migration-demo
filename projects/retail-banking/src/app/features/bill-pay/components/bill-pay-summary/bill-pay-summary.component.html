<mat-card appearance="outlined" class="bill-pay-summary bk-col bk-gap-8px">
  <div class="bk-row bk-justify-start bk-items-center bk-gap-8px">
    <mat-icon class="bill-pay-summary__icon">receipt_long</mat-icon>
    <h3 class="bill-pay-summary__title bk-flex">Bill Pay</h3>
  </div>

  <mat-divider></mat-divider>

  <div class="bk-row bk-justify-space-between bk-items-baseline">
    <span class="bill-pay-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="bill-pay-summary__blurb bk-hide-lt-md">Biller directory, one-off payments and standing instructions.</p>
</mat-card>
