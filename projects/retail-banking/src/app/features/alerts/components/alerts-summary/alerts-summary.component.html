<mat-card class="alerts-summary bk-col bk-gap-8px">
  <div class="bk-row bk-justify-start bk-items-center bk-gap-8px">
    <mat-icon class="alerts-summary__icon">notifications_active</mat-icon>
    <h3 class="alerts-summary__title bk-flex">Alerts</h3>
  </div>

  <mat-divider></mat-divider>

  <div class="bk-row bk-justify-space-between bk-items-baseline">
    <span class="alerts-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="alerts-summary__blurb bk-hide-lt-md">Balance, spend and security alert subscriptions.</p>
</mat-card>
