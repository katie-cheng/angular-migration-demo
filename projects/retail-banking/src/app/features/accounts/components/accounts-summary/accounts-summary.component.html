<mat-card class="accounts-summary" fxLayout="column" fxLayoutGap="8px">
  <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
    <mat-icon class="accounts-summary__icon">account_balance</mat-icon>
    <h3 class="accounts-summary__title" fxFlex>Accounts</h3>
  </div>

  <mat-divider></mat-divider>

  <div fxLayout="row" fxLayoutAlign="space-between baseline">
    <span class="accounts-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="accounts-summary__blurb" fxHide.lt-md>Balances and account detail for every product the customer holds.</p>
</mat-card>
