<mat-card appearance="outlined" class="accounts-summary bk-col bk-gap-8px">
  <div class="bk-row bk-justify-start bk-items-center bk-gap-8px">
    <mat-icon class="accounts-summary__icon">account_balance</mat-icon>
    <h3 class="accounts-summary__title bk-flex">Accounts</h3>
  </div>

  <mat-divider></mat-divider>

  <div class="bk-row bk-justify-space-between bk-items-baseline">
    <span class="accounts-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="accounts-summary__blurb bk-hide-lt-md">Balances and account detail for every product the customer holds.</p>
</mat-card>
