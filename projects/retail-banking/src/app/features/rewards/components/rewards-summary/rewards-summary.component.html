<mat-card class="rewards-summary" fxLayout="column" fxLayoutGap="8px">
  <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
    <mat-icon class="rewards-summary__icon">redeem</mat-icon>
    <h3 class="rewards-summary__title" fxFlex>Rewards</h3>
  </div>

  <mat-divider></mat-divider>

  <div fxLayout="row" fxLayoutAlign="space-between baseline">
    <span class="rewards-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="rewards-summary__blurb" fxHide.lt-md>Cashback offers, points balance and redemption history.</p>
</mat-card>
