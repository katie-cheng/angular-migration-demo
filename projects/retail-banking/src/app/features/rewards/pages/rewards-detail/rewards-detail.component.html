<section class="rewards-detail bk-col bk-gap-16px">
  <bk-breadcrumbs [crumbs]="crumbs"></bk-breadcrumbs>

  <div *ngIf="loading" class="rewards-detail__loading bk-row bk-justify-center bk-items-center">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <ng-container *ngIf="reward as reward">
    <mat-card class="rewards-detail__card bk-col bk-gap-12px">
      <div class="bk-row bk-col-lt-md bk-justify-space-between bk-items-start bk-gap-12px">
        <h2 class="rewards-detail__title bk-flex">Reward detail</h2>
        <div class="bk-row bk-gap-8px bk-justify-end bk-items-center">
          <button mat-stroked-button (click)="back()">Back</button>
        </div>
      </div>

      <mat-divider></mat-divider>

      <div class="rewards-detail__rows bk-col bk-gap-8px">
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Offer</span>
        <span class="detail-row__value bk-flex">{{ reward.offer }}</span>
      </div>
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Merchant</span>
        <span class="detail-row__value bk-flex">{{ reward.merchant }}</span>
      </div>
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Value</span>
        <span class="detail-row__value bk-flex">{{ reward.value | currency:'GBP' }}</span>
      </div>
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Expires</span>
        <span class="detail-row__value bk-flex">{{ reward.expiresOn | date:'mediumDate' }}</span>
      </div>
      </div>
    </mat-card>
  </ng-container>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>
</section>
