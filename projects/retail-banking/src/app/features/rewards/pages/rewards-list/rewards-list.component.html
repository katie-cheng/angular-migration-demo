<section class="rewards-list bk-col bk-gap-16px">
  <header class="rewards-list__header bk-row bk-col-lt-md bk-justify-space-between bk-items-center bk-justify-start-lt-md bk-items-stretch-lt-md bk-gap-12px">
    <div class="bk-col bk-gap-4px">
      <h1 class="rewards-list__title">Rewards</h1>
      <p class="rewards-list__subtitle bk-hide-lt-sm">Cashback offers, points balance and redemption history.</p>
    </div>

    <div class="bk-row bk-justify-end bk-items-center bk-gap-8px bk-flex-100-lt-md">
      <mat-form-field appearance="fill" class="rewards-list__search bk-flex-240px bk-flex-auto-lt-md">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="search" autocomplete="off" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-stroked-button (click)="reload()">
        <mat-icon>refresh</mat-icon>
        Refresh
      </button>
    </div>
  </header>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

  <div class="rewards-list__body bk-row bk-col-lt-lg bk-gap-16px">
    <mat-card class="rewards-list__table-card bk-flex-grow">
      <mat-progress-bar *ngIf="loading" mode="indeterminate" color="accent"></mat-progress-bar>

      <table mat-table [dataSource]="rows" matSort class="rewards-list__table">
    <ng-container matColumnDef="offer">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Offer</th>
      <td mat-cell *matCellDef="let reward">{{ reward.offer }}</td>
    </ng-container>

    <ng-container matColumnDef="merchant">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Merchant</th>
      <td mat-cell *matCellDef="let reward">{{ reward.merchant }}</td>
    </ng-container>

    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Value</th>
      <td mat-cell *matCellDef="let reward">{{ reward.value | currency:'GBP' }}</td>
    </ng-container>

    <ng-container matColumnDef="expiresOn">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Expires</th>
      <td mat-cell *matCellDef="let reward">{{ reward.expiresOn | date:'mediumDate' }}</td>
    </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row
            *matRowDef="let row; columns: displayedColumns"
            (click)="open(row)"
            class="rewards-list__row"></tr>
      </table>

      <bk-empty-state *ngIf="!loading && !rows.length"
                      heading="Nothing here yet"
                      message="Cashback offers, points balance and redemption history."></bk-empty-state>

      <mat-paginator [length]="total"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="[10, 25, 50]"
                     (page)="onPage($event)"></mat-paginator>
    </mat-card>

    <aside class="rewards-list__aside bk-flex-300px bk-flex-100-lt-lg bk-hide-lt-md">
      <bk-rewards-summary [count]="total" [loading]="loading"></bk-rewards-summary>
    </aside>
  </div>
</section>
