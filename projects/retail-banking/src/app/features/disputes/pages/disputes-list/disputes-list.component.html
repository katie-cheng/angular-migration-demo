<section class="disputes-list" fxLayout="column" fxLayoutGap="16px">
  <header class="disputes-list__header"
          fxLayout="row"
          fxLayout.lt-md="column"
          fxLayoutAlign="space-between center"
          fxLayoutAlign.lt-md="start stretch"
          fxLayoutGap="12px">
    <div fxLayout="column" fxLayoutGap="4px">
      <h1 class="disputes-list__title">Disputes</h1>
      <p class="disputes-list__subtitle" fxHide.lt-sm>Raise and track transaction disputes and chargebacks.</p>
    </div>

    <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="8px" fxFlex.lt-md="100">
      <mat-form-field appearance="legacy" class="disputes-list__search" fxFlex="240px" fxFlex.lt-md="auto">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="search" autocomplete="off" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="create()" fxHide.lt-sm>
        <mat-icon>add</mat-icon>
        New
      </button>
      <button mat-mini-fab color="primary" (click)="create()" fxShow.lt-sm fxHide>
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </header>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

  <div class="disputes-list__body" fxLayout="row" fxLayout.lt-lg="column" fxLayoutGap="16px">
    <mat-card class="disputes-list__table-card" fxFlex="grow">
      <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

      <table mat-table [dataSource]="rows" matSort class="disputes-list__table">
    <ng-container matColumnDef="transactionRef">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Transaction</th>
      <td mat-cell *matCellDef="let dispute">{{ dispute.transactionRef }}</td>
    </ng-container>

    <ng-container matColumnDef="reason">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Reason</th>
      <td mat-cell *matCellDef="let dispute">{{ dispute.reason }}</td>
    </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Amount</th>
      <td mat-cell *matCellDef="let dispute">{{ dispute.amount | currency:'GBP' }}</td>
    </ng-container>

    <ng-container matColumnDef="raisedOn">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Raised</th>
      <td mat-cell *matCellDef="let dispute">{{ dispute.raisedOn | date:'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let dispute"><bk-status-pill [status]="dispute.status"></bk-status-pill></td>
    </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row
            *matRowDef="let row; columns: displayedColumns"
            (click)="open(row)"
            class="disputes-list__row"></tr>
      </table>

      <bk-empty-state *ngIf="!loading && !rows.length"
                      heading="Nothing here yet"
                      message="Raise and track transaction disputes and chargebacks."></bk-empty-state>

      <mat-paginator [length]="total"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="[10, 25, 50]"
                     (page)="onPage($event)"></mat-paginator>
    </mat-card>

    <aside class="disputes-list__aside" fxFlex="300px" fxFlex.lt-lg="100" fxHide.lt-md>
      <bk-disputes-summary [count]="total" [loading]="loading"></bk-disputes-summary>
    </aside>
  </div>
</section>
