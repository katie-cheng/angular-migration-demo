<mat-card class="disputes-summary bk-col bk-gap-8px">
  <div class="bk-row bk-justify-start bk-items-center bk-gap-8px">
    <mat-icon class="disputes-summary__icon">gavel</mat-icon>
    <h3 class="disputes-summary__title bk-flex">Disputes</h3>
  </div>

  <mat-divider></mat-divider>

  <div class="bk-row bk-justify-space-between bk-items-baseline">
    <span class="disputes-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="disputes-summary__blurb bk-hide-lt-md">Raise and track transaction disputes and chargebacks.</p>
</mat-card>
