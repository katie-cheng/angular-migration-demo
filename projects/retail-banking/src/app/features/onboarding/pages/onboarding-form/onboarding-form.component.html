<section class="onboarding-form" fxLayout="column" fxLayoutGap="16px">
  <h1 class="onboarding-form__title">{{ editing ? 'Edit' : 'New' }} application</h1>

  <mat-card>
    <form [formGroup]="form" (ngSubmit)="submit()" fxLayout="column" fxLayoutGap="12px">
      <div fxLayout="row wrap" fxLayoutGap="16px grid" fxLayout.lt-md="column">
      <mat-form-field appearance="legacy" fxFlex="50" fxFlex.lt-md="100">
        <mat-label>Product</mat-label>
        <input matInput formControlName="product" />
        <mat-error *ngIf="form.controls['product'].hasError('required')">Product is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="legacy" fxFlex="50" fxFlex.lt-md="100">
        <mat-label>Stage</mat-label>
        <input matInput formControlName="stage" />
        <mat-error *ngIf="form.controls['stage'].hasError('required')">Stage is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="legacy" fxFlex="50" fxFlex.lt-md="100">
        <mat-label>Started</mat-label>
        <input matInput [matDatepicker]="startedOnPicker" formControlName="startedOn" />
        <mat-datepicker-toggle matSuffix [for]="startedOnPicker"></mat-datepicker-toggle>
        <mat-datepicker #startedOnPicker></mat-datepicker>
      </mat-form-field>
      </div>

      <mat-divider></mat-divider>

      <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="8px" fxLayoutAlign.lt-sm="stretch stretch">
        <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || saving">
          {{ saving ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </mat-card>
</section>
