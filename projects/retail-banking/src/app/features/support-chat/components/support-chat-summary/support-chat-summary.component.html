<mat-card class="support-chat-summary bk-col bk-gap-8px">
  <div class="bk-row bk-justify-start bk-items-center bk-gap-8px">
    <mat-icon class="support-chat-summary__icon">support_agent</mat-icon>
    <h3 class="support-chat-summary__title bk-flex">Support Chat</h3>
  </div>

  <mat-divider></mat-divider>

  <div class="bk-row bk-justify-space-between bk-items-baseline">
    <span class="support-chat-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="support-chat-summary__blurb bk-hide-lt-md">Secure messaging with the service team.</p>
</mat-card>
