<section class="support-chat-form bk-col bk-gap-16px">
  <h1 class="support-chat-form__title">{{ editing ? 'Edit' : 'New' }} conversation</h1>

  <mat-card>
    <form class="bk-col bk-gap-12px" [formGroup]="form" (ngSubmit)="submit()">
      <div class="bk-row bk-wrap bk-gap-16px bk-col-lt-md">
      <mat-form-field class="bk-flex-50 bk-flex-100-lt-md" appearance="fill">
        <mat-label>Subject</mat-label>
        <input matInput formControlName="subject" />
        <mat-error *ngIf="form.controls['subject'].hasError('required')">Subject is required</mat-error>
      </mat-form-field>

      <mat-form-field class="bk-flex-50 bk-flex-100-lt-md" appearance="fill">
        <mat-label>Last message</mat-label>
        <input matInput [matDatepicker]="lastMessageOnPicker" formControlName="lastMessageOn" />
        <mat-datepicker-toggle matSuffix [for]="lastMessageOnPicker"></mat-datepicker-toggle>
        <mat-datepicker #lastMessageOnPicker></mat-datepicker>
      </mat-form-field>
      </div>

      <mat-divider></mat-divider>

      <div class="bk-row bk-justify-end bk-items-center bk-gap-8px bk-justify-start-lt-sm bk-items-stretch-lt-sm">
        <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || saving">
          {{ saving ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </mat-card>
</section>
