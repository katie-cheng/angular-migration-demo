<mat-card appearance="outlined" class="cards-summary bk-col bk-gap-8px">
  <div class="bk-row bk-justify-start bk-items-center bk-gap-8px">
    <mat-icon class="cards-summary__icon">credit_card</mat-icon>
    <h3 class="cards-summary__title bk-flex">Cards</h3>
  </div>

  <mat-divider></mat-divider>

  <div class="bk-row bk-justify-space-between bk-items-baseline">
    <span class="cards-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="cards-summary__blurb bk-hide-lt-md">Card controls: freeze, replace, travel notices and PIN reset.</p>
</mat-card>
