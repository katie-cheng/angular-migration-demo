<section class="cards-detail bk-col bk-gap-16px">
  <bk-breadcrumbs [crumbs]="crumbs"></bk-breadcrumbs>

  <div *ngIf="loading" class="cards-detail__loading bk-row bk-justify-center bk-items-center">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <ng-container *ngIf="card as card">
    <mat-card appearance="outlined" class="cards-detail__card bk-col bk-gap-12px">
      <div class="bk-row bk-col-lt-md bk-justify-space-between bk-items-start bk-gap-12px">
        <h2 class="cards-detail__title bk-flex">Card detail</h2>
        <div class="bk-row bk-gap-8px bk-justify-end bk-items-center">
          <button mat-stroked-button (click)="back()">Back</button>
        </div>
      </div>

      <mat-divider></mat-divider>

      <div class="cards-detail__rows bk-col bk-gap-8px">
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Network</span>
        <span class="detail-row__value bk-flex">{{ card.network }}</span>
      </div>
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Card</span>
        <span class="detail-row__value bk-flex">{{ card.maskedNumber }}</span>
      </div>
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Expires</span>
        <span class="detail-row__value bk-flex">{{ card.expiry | date:'mediumDate' }}</span>
      </div>
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Status</span>
        <span class="detail-row__value bk-flex"><bk-status-pill [status]="card.status"></bk-status-pill></span>
      </div>
      </div>
    </mat-card>
  </ng-container>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>
</section>
