<section class="cards-list" fxLayout="column" fxLayoutGap="16px">
  <header class="cards-list__header"
          fxLayout="row"
          fxLayout.lt-md="column"
          fxLayoutAlign="space-between center"
          fxLayoutAlign.lt-md="start stretch"
          fxLayoutGap="12px">
    <div fxLayout="column" fxLayoutGap="4px">
      <h1 class="cards-list__title">Cards</h1>
      <p class="cards-list__subtitle" fxHide.lt-sm>Card controls: freeze, replace, travel notices and PIN reset.</p>
    </div>

    <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="8px" fxFlex.lt-md="100">
      <mat-form-field appearance="legacy" class="cards-list__search" fxFlex="240px" fxFlex.lt-md="auto">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="search" autocomplete="off" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-stroked-button (click)="reload()">
        <mat-icon>refresh</mat-icon>
        Refresh
      </button>
    </div>
  </header>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

  <div class="cards-list__body" fxLayout="row" fxLayout.lt-lg="column" fxLayoutGap="16px">
    <mat-card class="cards-list__table-card" fxFlex="grow">
      <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

      <table mat-table [dataSource]="rows" matSort class="cards-list__table">
    <ng-container matColumnDef="network">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Network</th>
      <td mat-cell *matCellDef="let card">{{ card.network }}</td>
    </ng-container>

    <ng-container matColumnDef="maskedNumber">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Card</th>
      <td mat-cell *matCellDef="let card">{{ card.maskedNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="expiry">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Expires</th>
      <td mat-cell *matCellDef="let card">{{ card.expiry | date:'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let card"><bk-status-pill [status]="card.status"></bk-status-pill></td>
    </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row
            *matRowDef="let row; columns: displayedColumns"
            (click)="open(row)"
            class="cards-list__row"></tr>
      </table>

      <bk-empty-state *ngIf="!loading && !rows.length"
                      heading="Nothing here yet"
                      message="Card controls: freeze, replace, travel notices and PIN reset."></bk-empty-state>

      <mat-paginator [length]="total"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="[10, 25, 50]"
                     (page)="onPage($event)"></mat-paginator>
    </mat-card>

    <aside class="cards-list__aside" fxFlex="300px" fxFlex.lt-lg="100" fxHide.lt-md>
      <bk-cards-summary [count]="total" [loading]="loading"></bk-cards-summary>
    </aside>
  </div>
</section>
