<mat-card appearance="outlined" class="mortgage-summary bk-col bk-gap-8px">
  <div class="bk-row bk-justify-start bk-items-center bk-gap-8px">
    <mat-icon class="mortgage-summary__icon">home_work</mat-icon>
    <h3 class="mortgage-summary__title bk-flex">Mortgage</h3>
  </div>

  <mat-divider></mat-divider>

  <div class="bk-row bk-justify-space-between bk-items-baseline">
    <span class="mortgage-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="mortgage-summary__blurb bk-hide-lt-md">Mortgage account view, rate switch eligibility and overpayments.</p>
</mat-card>
