<section class="mortgage-list" fxLayout="column" fxLayoutGap="16px">
  <header class="mortgage-list__header"
          fxLayout="row"
          fxLayout.lt-md="column"
          fxLayoutAlign="space-between center"
          fxLayoutAlign.lt-md="start stretch"
          fxLayoutGap="12px">
    <div fxLayout="column" fxLayoutGap="4px">
      <h1 class="mortgage-list__title">Mortgage</h1>
      <p class="mortgage-list__subtitle" fxHide.lt-sm>Mortgage account view, rate switch eligibility and overpayments.</p>
    </div>

    <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="8px" fxFlex.lt-md="100">
      <mat-form-field appearance="legacy" class="mortgage-list__search" fxFlex="240px" fxFlex.lt-md="auto">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="search" autocomplete="off" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-stroked-button (click)="reload()">
        <mat-icon>refresh</mat-icon>
        Refresh
      </button>
    </div>
  </header>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

  <div class="mortgage-list__body" fxLayout="row" fxLayout.lt-lg="column" fxLayoutGap="16px">
    <mat-card class="mortgage-list__table-card" fxFlex="grow">
      <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

      <table mat-table [dataSource]="rows" matSort class="mortgage-list__table">
    <ng-container matColumnDef="property">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Property</th>
      <td mat-cell *matCellDef="let mortgage">{{ mortgage.property }}</td>
    </ng-container>

    <ng-container matColumnDef="outstanding">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Outstanding</th>
      <td mat-cell *matCellDef="let mortgage">{{ mortgage.outstanding | currency:'GBP' }}</td>
    </ng-container>

    <ng-container matColumnDef="rate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Rate</th>
      <td mat-cell *matCellDef="let mortgage">{{ mortgage.rate }}</td>
    </ng-container>

    <ng-container matColumnDef="termEndsOn">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Term ends</th>
      <td mat-cell *matCellDef="let mortgage">{{ mortgage.termEndsOn | date:'mediumDate' }}</td>
    </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row
            *matRowDef="let row; columns: displayedColumns"
            (click)="open(row)"
            class="mortgage-list__row"></tr>
      </table>

      <bk-empty-state *ngIf="!loading && !rows.length"
                      heading="Nothing here yet"
                      message="Mortgage account view, rate switch eligibility and overpayments."></bk-empty-state>

      <mat-paginator [length]="total"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="[10, 25, 50]"
                     (page)="onPage($event)"></mat-paginator>
    </mat-card>

    <aside class="mortgage-list__aside" fxFlex="300px" fxFlex.lt-lg="100" fxHide.lt-md>
      <bk-mortgage-summary [count]="total" [loading]="loading"></bk-mortgage-summary>
    </aside>
  </div>
</section>
