<mat-card class="profile-settings-summary" fxLayout="column" fxLayoutGap="8px">
  <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
    <mat-icon class="profile-settings-summary__icon">manage_accounts</mat-icon>
    <h3 class="profile-settings-summary__title" fxFlex>Profile Settings</h3>
  </div>

  <mat-divider></mat-divider>

  <div fxLayout="row" fxLayoutAlign="space-between baseline">
    <span class="profile-settings-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="profile-settings-summary__blurb" fxHide.lt-md>Contact details, marketing preferences and security settings.</p>
</mat-card>
