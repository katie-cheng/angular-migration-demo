<section class="profile-settings-list bk-col bk-gap-16px">
  <header class="profile-settings-list__header bk-row bk-col-lt-md bk-justify-space-between bk-items-center bk-justify-start-lt-md bk-items-stretch-lt-md bk-gap-12px">
    <div class="bk-col bk-gap-4px">
      <h1 class="profile-settings-list__title">Profile Settings</h1>
      <p class="profile-settings-list__subtitle bk-hide-lt-sm">Contact details, marketing preferences and security settings.</p>
    </div>

    <div class="bk-row bk-justify-end bk-items-center bk-gap-8px bk-flex-100-lt-md">
      <mat-form-field appearance="legacy" class="profile-settings-list__search bk-flex-240px bk-flex-auto-lt-md">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="search" autocomplete="off" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button class="bk-hide-lt-sm" mat-raised-button color="primary" (click)="create()">
        <mat-icon>add</mat-icon>
        New
      </button>
      <button class="bk-show-lt-sm bk-hide" mat-mini-fab color="primary" (click)="create()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </header>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

  <div class="profile-settings-list__body bk-row bk-col-lt-lg bk-gap-16px">
    <mat-card class="profile-settings-list__table-card bk-flex-grow">
      <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

      <table mat-table [dataSource]="rows" matSort class="profile-settings-list__table">
    <ng-container matColumnDef="label">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Setting</th>
      <td mat-cell *matCellDef="let preference">{{ preference.label }}</td>
    </ng-container>

    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Value</th>
      <td mat-cell *matCellDef="let preference">{{ preference.value }}</td>
    </ng-container>

    <ng-container matColumnDef="updatedOn">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Updated</th>
      <td mat-cell *matCellDef="let preference">{{ preference.updatedOn | date:'mediumDate' }}</td>
    </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row
            *matRowDef="let row; columns: displayedColumns"
            (click)="open(row)"
            class="profile-settings-list__row"></tr>
      </table>

      <bk-empty-state *ngIf="!loading && !rows.length"
                      heading="Nothing here yet"
                      message="Contact details, marketing preferences and security settings."></bk-empty-state>

      <mat-paginator [length]="total"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="[10, 25, 50]"
                     (page)="onPage($event)"></mat-paginator>
    </mat-card>

    <aside class="profile-settings-list__aside bk-flex-300px bk-flex-100-lt-lg bk-hide-lt-md">
      <bk-profile-settings-summary [count]="total" [loading]="loading"></bk-profile-settings-summary>
    </aside>
  </div>
</section>
