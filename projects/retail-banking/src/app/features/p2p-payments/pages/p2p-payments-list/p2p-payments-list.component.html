<section class="p2p-payments-list bk-col bk-gap-16px">
  <header class="p2p-payments-list__header bk-row bk-col-lt-md bk-justify-space-between bk-items-center bk-justify-start-lt-md bk-items-stretch-lt-md bk-gap-12px">
    <div class="bk-col bk-gap-4px">
      <h1 class="p2p-payments-list__title">P2p Payments</h1>
      <p class="p2p-payments-list__subtitle bk-hide-lt-sm">Person-to-person payments by phone number or handle.</p>
    </div>

    <div class="bk-row bk-justify-end bk-items-center bk-gap-8px bk-flex-100-lt-md">
      <mat-form-field appearance="fill" class="p2p-payments-list__search bk-flex-240px bk-flex-auto-lt-md">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="search" autocomplete="off" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button class="bk-hide-lt-sm" mat-raised-button color="primary" (click)="create()">
        <mat-icon>add</mat-icon>
        New
      </button>
      <button class="bk-show-lt-sm bk-hide" mat-mini-fab color="primary" (click)="create()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </header>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

  <div class="p2p-payments-list__body bk-row bk-col-lt-lg bk-gap-16px">
    <mat-card appearance="outlined" class="p2p-payments-list__table-card bk-flex-grow">
      <mat-progress-bar *ngIf="loading" mode="indeterminate" color="accent"></mat-progress-bar>

      <table mat-table [dataSource]="rows" matSort class="p2p-payments-list__table">
    <ng-container matColumnDef="recipient">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Recipient</th>
      <td mat-cell *matCellDef="let payment">{{ payment.recipient }}</td>
    </ng-container>

    <ng-container matColumnDef="handle">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Handle</th>
      <td mat-cell *matCellDef="let payment">{{ payment.handle }}</td>
    </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Amount</th>
      <td mat-cell *matCellDef="let payment">{{ payment.amount | currency:'GBP' }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let payment"><bk-status-pill [status]="payment.status"></bk-status-pill></td>
    </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row
            *matRowDef="let row; columns: displayedColumns"
            (click)="open(row)"
            class="p2p-payments-list__row"></tr>
      </table>

      <bk-empty-state *ngIf="!loading && !rows.length"
                      heading="Nothing here yet"
                      message="Person-to-person payments by phone number or handle."></bk-empty-state>

      <mat-paginator [length]="total"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="[10, 25, 50]"
                     (page)="onPage($event)"></mat-paginator>
    </mat-card>

    <aside class="p2p-payments-list__aside bk-flex-300px bk-flex-100-lt-lg bk-hide-lt-md">
      <bk-p2p-payments-summary [count]="total" [loading]="loading"></bk-p2p-payments-summary>
    </aside>
  </div>
</section>
