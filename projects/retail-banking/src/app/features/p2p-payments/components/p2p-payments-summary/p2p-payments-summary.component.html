<mat-card class="p2p-payments-summary bk-col bk-gap-8px">
  <div class="bk-row bk-justify-start bk-items-center bk-gap-8px">
    <mat-icon class="p2p-payments-summary__icon">send</mat-icon>
    <h3 class="p2p-payments-summary__title bk-flex">P2p Payments</h3>
  </div>

  <mat-divider></mat-divider>

  <div class="bk-row bk-justify-space-between bk-items-baseline">
    <span class="p2p-payments-summary__headline">{{ headline }}</span>
    <mat-spinner *ngIf="loading" diameter="16"></mat-spinner>
  </div>

  <p class="p2p-payments-summary__blurb bk-hide-lt-md">Person-to-person payments by phone number or handle.</p>
</mat-card>
