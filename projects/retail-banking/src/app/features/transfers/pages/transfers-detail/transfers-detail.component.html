<section class="transfers-detail bk-col bk-gap-16px">
  <bk-breadcrumbs [crumbs]="crumbs"></bk-breadcrumbs>

  <div *ngIf="loading" class="transfers-detail__loading bk-row bk-justify-center bk-items-center">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <ng-container *ngIf="transfer as transfer">
    <mat-card appearance="outlined" class="transfers-detail__card bk-col bk-gap-12px">
      <div class="bk-row bk-col-lt-md bk-justify-space-between bk-items-start bk-gap-12px">
        <h2 class="transfers-detail__title bk-flex">Transfer detail</h2>
        <div class="bk-row bk-gap-8px bk-justify-end bk-items-center">
          <button mat-stroked-button (click)="edit()">Edit</button>
          <button mat-raised-button color="warn" (click)="confirmRemove()">Remove</button>
        </div>
      </div>

      <mat-divider></mat-divider>

      <div class="transfers-detail__rows bk-col bk-gap-8px">
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Reference</span>
        <span class="detail-row__value bk-flex">{{ transfer.reference }}</span>
      </div>
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Amount</span>
        <span class="detail-row__value bk-flex">{{ transfer.amount | currency:'GBP' }}</span>
      </div>
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Scheduled</span>
        <span class="detail-row__value bk-flex">{{ transfer.scheduledFor | date:'mediumDate' }}</span>
      </div>
      <div class="detail-row bk-row bk-col-lt-sm bk-gap-8px">
        <span class="detail-row__label bk-flex-180px bk-flex-auto-lt-sm">Status</span>
        <span class="detail-row__value bk-flex"><bk-status-pill [status]="transfer.status"></bk-status-pill></span>
      </div>
      </div>
    </mat-card>
  </ng-container>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>
</section>
