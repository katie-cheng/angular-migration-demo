<div class="step-up" fxLayout="column" fxLayoutAlign="center center" fxFill>
  <mat-card class="step-up__card" fxLayout="column" fxLayoutGap="16px">
    <h2 class="step-up__title">Confirm it's you</h2>
    <p class="step-up__copy">We need a one-time code before you can move money.</p>

    <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

    <form [formGroup]="form" fxLayout="column" fxLayoutGap="8px">
      <mat-form-field appearance="legacy">
        <mat-label>Send code to</mat-label>
        <mat-select formControlName="channelId">
          <mat-option *ngFor="let channel of channels" [value]="channel.id">
            {{ channel.hint }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div fxLayout="row" fxLayoutGap="8px" fxLayout.xs="column">
        <mat-form-field appearance="legacy" fxFlex>
          <mat-label>6-digit code</mat-label>
          <input matInput formControlName="code" inputmode="numeric" maxlength="6" />
        </mat-form-field>

        <button mat-stroked-button type="button" (click)="send()" [disabled]="sending">
          {{ sending ? 'Sending...' : 'Send code' }}
        </button>
      </div>

      <button mat-raised-button color="primary" type="button" (click)="verify()">Verify</button>
    </form>
  </mat-card>
</div>
