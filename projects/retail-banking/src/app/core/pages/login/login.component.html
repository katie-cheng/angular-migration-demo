<div class="login bk-row bk-col-lt-md bk-fill">
  <section class="login__marketing bk-flex-45 bk-hide-lt-md bk-col bk-justify-center bk-items-start bk-gap-16px">
    <h1 class="login__marketing-title">Northwind Retail</h1>
    <p class="login__marketing-copy">Everyday banking, built around your money.</p>
  </section>

  <section class="login__form-panel bk-flex bk-col bk-justify-center bk-items-center">
    <mat-card appearance="outlined" class="login__card bk-col bk-gap-16px">
      <h2 class="login__title">Sign in</h2>

      <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

      <form class="bk-col bk-gap-8px" [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="fill">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
          <mat-error *ngIf="form.controls['username'].hasError('required')">Username is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          <mat-error *ngIf="form.controls['password'].hasError('minlength')">
            Passwords are at least 8 characters
          </mat-error>
        </mat-form-field>

        <div class="bk-row bk-justify-space-between bk-items-center">
          <mat-checkbox formControlName="rememberDevice">Remember this device</mat-checkbox>
          <a href="#" class="login__forgot bk-hide-xs">Forgotten details?</a>
        </div>

        <button mat-raised-button color="primary" type="submit" [disabled]="submitting">
          {{ submitting ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>
    </mat-card>
  </section>
</div>
