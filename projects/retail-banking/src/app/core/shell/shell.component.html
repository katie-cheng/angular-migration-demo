<div class="shell" fxLayout="column" fxFill>
  <mat-toolbar color="primary" class="shell__toolbar" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
    <button mat-icon-button (click)="toggle()" aria-label="Toggle navigation">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="shell__brand" fxHide.xs>Northwind Retail</span>
    <span class="shell__brand shell__brand--short" fxShow.xs fxHide>NR</span>

    <span fxFlex></span>

    <button mat-icon-button routerLink="/alerts" aria-label="Alerts" fxHide.xs>
      <mat-icon>notifications</mat-icon>
    </button>

    <button mat-button [matMenuTriggerFor]="profileMenu" class="shell__profile">
      <mat-icon>account_circle</mat-icon>
      <span fxHide.lt-md>{{ session?.profile?.displayName }}</span>
    </button>

    <mat-menu #profileMenu="matMenu">
      <button mat-menu-item routerLink="/profile-settings">
        <mat-icon>settings</mat-icon>
        Settings
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        Sign out
      </button>
    </mat-menu>
  </mat-toolbar>

  <mat-sidenav-container class="shell__container" fxFlex>
    <mat-sidenav #sidenav
                 class="shell__sidenav"
                 [mode]="sidenavMode"
                 [opened]="!handset"
                 [fixedInViewport]="handset">
      <mat-nav-list class="shell__nav" fxLayout="column">
        <a mat-list-item
           *ngFor="let item of visibleNavItems()"
           [routerLink]="item.route"
           routerLinkActive="shell__nav-item--active"
           (click)="trackNav(item)"
           fxLayout="row"
           fxLayoutAlign="start center"
           fxLayoutGap="12px">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span fxFlex>{{ item.label }}</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="shell__content">
      <div class="bk-page" fxLayout="column" fxLayoutGap="16px">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
