<section class="dashboard" fxLayout="column" fxLayoutGap="20px" fxLayoutGap.lt-md="12px">
  <header class="dashboard__header"
          fxLayout="row"
          fxLayout.lt-md="column"
          fxLayoutAlign="space-between center"
          fxLayoutAlign.lt-md="start stretch"
          fxLayoutGap="12px">
    <div fxLayout="column" fxLayoutGap="4px" fxFlex>
      <h1 class="dashboard__greeting">{{ greeting }}</h1>
      <p class="dashboard__subtitle" fxHide.xs>Here is where your money stands today.</p>
    </div>

    <div fxLayout="row" fxLayoutGap="8px" fxLayoutAlign="end center" fxLayoutAlign.lt-md="start center">
      <button mat-stroked-button routerLink="/statements" fxHide.xs>
        <mat-icon>description</mat-icon>
        Statements
      </button>
      <button mat-raised-button color="primary" routerLink="/transfers/new">
        <mat-icon>swap_horiz</mat-icon>
        Move money
      </button>
    </div>
  </header>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

  <bk-balance-strip [total]="totalAvailable" [accounts]="accounts" [loading]="loading"></bk-balance-strip>

  <div class="dashboard__grid" fxLayout="row wrap" fxLayout.lt-lg="column" fxLayoutGap="16px grid">
    <div fxFlex="66" fxFlex.lt-lg="100" fxLayout="column" fxLayoutGap="16px">
      <bk-recent-activity [transactions]="recent" [loading]="loading"></bk-recent-activity>

      <mat-card class="dashboard__accounts">
        <div fxLayout="row" fxLayoutAlign="space-between center">
          <h2 class="dashboard__card-title" fxFlex>Your accounts</h2>
          <a mat-button routerLink="/accounts">View all</a>
        </div>

        <mat-divider></mat-divider>

        <div class="dashboard__account-grid" fxLayout="row wrap" fxLayout.xs="column" fxLayoutGap="12px grid">
          <div *ngFor="let account of accounts"
               [fxFlex]="columns === 1 ? '100' : '50'"
               fxFlex.xs="100">
            <bk-account-tile [accountName]="account.nickname"
                             [accountNumber]="account.maskedNumber"
                             [balance]="account.currentBalance"
                             [available]="account.availableBalance"></bk-account-tile>
          </div>
        </div>
      </mat-card>
    </div>

    <div fxFlex="34" fxFlex.lt-lg="100" fxLayout="column" fxLayoutGap="16px">
      <bk-quick-actions></bk-quick-actions>
      <bk-spend-breakdown [transactions]="recent"></bk-spend-breakdown>
    </div>
  </div>
</section>
