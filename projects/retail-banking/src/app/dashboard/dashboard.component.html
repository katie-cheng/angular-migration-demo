<section class="dashboard bk-col bk-gap-20px bk-gap-12px-lt-md">
  <header class="dashboard__header bk-row bk-col-lt-md bk-justify-space-between bk-items-center bk-justify-start-lt-md bk-items-stretch-lt-md bk-gap-12px">
    <div class="bk-col bk-gap-4px bk-flex">
      <h1 class="dashboard__greeting">{{ greeting }}</h1>
      <p class="dashboard__subtitle bk-hide-xs">Here is where your money stands today.</p>
    </div>

    <div class="bk-row bk-gap-8px bk-justify-end bk-items-center bk-justify-start-lt-md bk-items-center-lt-md">
      <button class="bk-hide-xs" mat-stroked-button routerLink="/statements">
        <mat-icon>description</mat-icon>
        Statements
      </button>
      <button mat-raised-button color="primary" routerLink="/transfers/new">
        <mat-icon>swap_horiz</mat-icon>
        Move money
      </button>
    </div>
  </header>

  <bk-alert-banner *ngIf="error" tone="error" [message]="error"></bk-alert-banner>

  <bk-balance-strip [total]="totalAvailable" [accounts]="accounts" [loading]="loading"></bk-balance-strip>

  <div class="dashboard__grid bk-row bk-wrap bk-col-lt-lg bk-gap-16px">
    <div class="bk-flex-66 bk-flex-100-lt-lg bk-col bk-gap-16px">
      <bk-recent-activity [transactions]="recent" [loading]="loading"></bk-recent-activity>

      <mat-card class="dashboard__accounts">
        <div class="bk-row bk-justify-space-between bk-items-center">
          <h2 class="dashboard__card-title bk-flex">Your accounts</h2>
          <a mat-button routerLink="/accounts">View all</a>
        </div>

        <mat-divider></mat-divider>

        <div class="dashboard__account-grid bk-row bk-wrap bk-col-xs bk-gap-12px">
          <div *ngFor="let account of accounts"
               class="bk-flex-100-xs"
               [class.bk-flex-100]="columns === 1"
               [class.bk-flex-50]="columns === 2">
            <bk-account-tile [accountName]="account.nickname"
                             [accountNumber]="account.maskedNumber"
                             [balance]="account.currentBalance"
                             [available]="account.availableBalance"
                             [currency]="account.currency"></bk-account-tile>
          </div>
        </div>
      </mat-card>
    </div>

    <div class="bk-flex-34 bk-flex-100-lt-lg bk-col bk-gap-16px">
      <bk-quick-actions></bk-quick-actions>
      <bk-spend-breakdown [transactions]="recent"></bk-spend-breakdown>
    </div>
  </div>
</section>
