<mat-card class="recent-activity bk-col bk-gap-8px">
  <div class="bk-row bk-justify-space-between bk-items-center">
    <h2 class="recent-activity__title bk-flex">Recent activity</h2>
    <a class="bk-hide-xs" mat-button routerLink="/accounts">See all</a>
  </div>

  <mat-divider></mat-divider>

  <mat-progress-bar *ngIf="loading" mode="indeterminate" color="accent"></mat-progress-bar>

  <div class="recent-activity__list bk-col">
    <div *ngFor="let transaction of transactions; trackBy: trackById"
         class="recent-activity__row bk-row bk-col-xs bk-justify-space-between bk-items-center bk-justify-start-xs bk-items-stretch-xs bk-gap-12px">
      <div class="bk-col bk-flex bk-gap-2px">
        <span class="recent-activity__description">{{ transaction.description }}</span>
        <span class="recent-activity__meta bk-hide-xs">
          {{ transaction.postedAt | date:'mediumDate' }} &middot; {{ transaction.merchantCategory }}
        </span>
      </div>

      <bk-status-pill class="bk-hide-lt-md" [status]="transaction.status"></bk-status-pill>

      <span class="recent-activity__amount bk-flex-120px bk-flex-auto-xs"
            [class.recent-activity__amount--credit]="transaction.amount > 0">
        {{ transaction.amount | currency:transaction.currency }}
      </span>
    </div>
  </div>

  <bk-empty-state *ngIf="!loading && !transactions.length"
                  heading="No activity yet"
                  message="Transactions appear here as soon as they are authorised."></bk-empty-state>
</mat-card>
