<mat-card appearance="outlined" class="spend-breakdown bk-col bk-gap-10px">
  <h2 class="spend-breakdown__title">Where your money went</h2>
  <mat-divider></mat-divider>

  <bk-sparkline [values]="trend" stroke="#003366" label="Spending trend"></bk-sparkline>

  <div *ngFor="let slice of slices" class="spend-breakdown__slice bk-col bk-gap-4px">
    <div class="bk-row bk-justify-space-between bk-items-baseline">
      <span class="bk-flex">{{ slice.category }}</span>
      <span class="spend-breakdown__amount">{{ slice.amount | currency:'GBP' }}</span>
    </div>
    <mat-progress-bar mode="determinate" color="accent" [value]="slice.share"></mat-progress-bar>
  </div>

  <bk-empty-state *ngIf="!slices.length"
                  heading="Nothing to break down"
                  message="Spending categories appear once you have card activity."></bk-empty-state>
</mat-card>
